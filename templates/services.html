{{ define "content" }}
<section class="services-section">
    <h2>{{ .Title }}</h2>
    <table class="services-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Цена</th>
                <th>Длительность</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Services }}
            <tr>
                <td>{{ .ID }}</td>
                <td>{{ .Name }}</td>
                <td>{{ printf "%.2f" .Price }} ₽</td>
                <td>{{ .Duration }}</td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</section>
{{ end }}
