{{ define "content" }}
<div class="admin-layout">
    {{ template "admin_sidebar" . }}
    <div class="admin-content">
        {{ if .CurrentUser }}
        <div class="admin-header" style="background: #2a2a2a; padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px;">
            <div style="color: #f0f0f0;">
                Вы вошли как: <strong style="color: var(--light-gold);">{{ .CurrentUser.Username }}</strong>
            </div>
            <form action="/admin/logout" method="POST" style="margin: 0;">
                <button type="submit" class="btn btn-secondary" style="padding: 8px 16px;">Выйти</button>
            </form>
        </div>
        {{ end }}
        {{ block "admin_content" . }} {{ end }}
    </div>
</div>
{{ end }}

{{ define "admin_sidebar" }}
<aside class="admin-sidebar">
    <nav>
        <a href="/admin">Главная</a>
        <a href="/admin/services">Услуги</a>
        <a href="/admin/masters">Мастера</a>
        <a href="/admin/users">Пользователи</a>
    </nav>
</aside>
{{ end }}
