{{ define "content" }}
<div class="admin-container">
    <h2>{{ .Title }}</h2>
    <form action="/admin/services/{{ .Service.ID }}" method="POST" class="admin-form">
        <input type="hidden" name="_method" value="PUT">
        <div class="form-group">
            <label for="name">Название услуги</label>
            <input type="text" id="name" name="name" value="{{ .Service.Name }}" required class="form-control">
        </div>
        <div class="form-group">
            <label for="price">Цена</label>
            <input type="number" id="price" name="price" step="0.01" min="0" value="{{ printf "%.2f" .Service.Price }}" required class="form-control">
        </div>
        <div class="form-group">
            <label for="duration">Длительность</label>
            <input type="text" id="duration" name="duration" value="{{ .Service.Duration }}" required class="form-control">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/admin/services" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{{ end }}
