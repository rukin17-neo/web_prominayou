{{ define "content" }}
<div class="admin-container" style="max-width: 400px; margin: 100px auto;">
    <h2 style="text-align: center; color: var(--light-gold); margin-bottom: 30px;">Восстановление пароля</h2>

    {{ if .Success }}
    <div class="success-message" style="background: #4CAF50; color: white; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
        <p style="margin: 0;">Инструкции по восстановлению пароля отправлены на указанный email.</p>
        <p style="margin: 10px 0 0 0;">Проверьте почтовый ящик и следуйте инструкциям в письме.</p>
    </div>
    <div style="text-align: center; margin-top: 25px;">
        <a href="/admin/login" class="btn btn-secondary" style="display: inline-block; padding: 10px 20px;">Вернуться к входу</a>
    </div>
    {{ else }}
    <form action="/admin/forgot-password" method="POST" class="admin-form" style="padding: 30px;">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required autofocus class="form-control" placeholder="your@email.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Отправить</button>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/admin/login" style="color: #2196F3; text-decoration: none;">Вернуться к входу</a>
        </div>
    </form>
    {{ end }}
</div>
{{ end }}
