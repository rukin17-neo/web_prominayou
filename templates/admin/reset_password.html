{{ define "content" }}
<div class="admin-container" style="max-width: 400px; margin: 100px auto;">
    <h2 style="text-align: center; color: var(--light-gold); margin-bottom: 30px;">Сброс пароля</h2>

    {{ if .Error }}
    <div class="error-message" style="background: #f44336; color: white; padding: 12px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
        {{ .Error }}
    </div>
    {{ if not .Token }}
    <div style="text-align: center; margin-top: 25px;">
        <a href="/admin/forgot-password" class="btn btn-secondary" style="display: inline-block; padding: 10px 20px;">Запросить новую ссылку</a>
    </div>
    {{ end }}
    {{ end }}

    {{ if .Token }}
    <form action="/admin/reset-password" method="POST" class="admin-form" style="padding: 30px;">
        {{ .CSRFField }}
        <input type="hidden" name="token" value="{{ .Token }}">
        <div class="form-group">
            <label for="password">Новый пароль:</label>
            <input type="password" id="password" name="password" required minlength="8" autofocus class="form-control">
            <small style="color: #aaa; font-size: 12px; margin-top: 5px; display: block;">Минимум 8 символов</small>
        </div>
        <div class="form-group">
            <label for="password_confirm">Подтвердите пароль:</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Сбросить пароль</button>
    </form>
    {{ end }}
</div>
{{ end }}
